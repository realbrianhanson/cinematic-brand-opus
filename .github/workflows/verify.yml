name: verify

# Reproducible checks for the PushTen authority template.
# Nothing here publishes content, sends email, or calls a paid AI provider.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Correctness lint (no formatting rules)
        run: bun run lint

      - name: Tests
        # Covers the security, SSR metadata, publish-gate, feed and
        # rebrand-preset regression suites.
        run: bun run test

      - name: Isolated database regression tests
        run: bun run test:database

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Edge function typecheck
        run: deno check --no-config supabase/functions/*/index.ts

      - name: Production build
        # The repository path must not contain an apostrophe; see README.md.
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key

      - name: Production worker runtime smoke test
        # Read-only local GETs: login SSR and its compiled JavaScript asset.
        run: bun run test:preview

      - name: Formatting (Prettier only)
        # Last, after the build, so formatting drift (often in files the
        # Lovable agent writes) still turns the run red without skipping the
        # lint, tests, database, edge-function and build checks above. It runs
        # even when an earlier step failed, so every run reports formatting.
        if: ${{ !cancelled() }}
        run: bun run format:check
