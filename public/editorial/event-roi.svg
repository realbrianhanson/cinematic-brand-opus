<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">A BUSY BOOTH IS NOT A PROFIT REPORT</title><desc id="desc">Illustrative equation: $1,440 contribution minus $900 event cost equals $540 net contribution.</desc><rect width="1200" height="675" fill="#131710"/><text x="65" y="83" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#D4AF55" text-anchor="start">A BUSY BOOTH IS NOT A PROFIT REPORT</text><path d="M65 110 L1135 110" stroke="#514A36" stroke-width="1" fill="none" stroke-linecap="round"/><circle cx="220" cy="335" r="125" fill="#20291F" stroke="none" stroke-width="4"/><text x="220" y="320" font-family="Arial, sans-serif" font-size="49" font-weight="700" fill="#D4AF55" text-anchor="middle">$1,440</text><text x="220" y="365" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#EEECE6" text-anchor="middle">contribution</text><text x="380" y="350" font-family="Arial, sans-serif" font-size="62" font-weight="500" fill="#EEECE6" text-anchor="start">−</text><circle cx="570" cy="335" r="110" fill="#30251D" stroke="none" stroke-width="4"/><text x="570" y="320" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#EDAD7D" text-anchor="middle">$900</text><text x="570" y="365" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#EEECE6" text-anchor="middle">event cost</text><text x="720" y="350" font-family="Arial, sans-serif" font-size="62" font-weight="500" fill="#EEECE6" text-anchor="start">=</text><rect x="825" y="220" width="285" height="230" rx="20" fill="#D4AF55" stroke="none" stroke-width="3"/><text x="965" y="325" font-family="Arial, sans-serif" font-size="60" font-weight="700" fill="#14120B" text-anchor="middle">$540</text><text x="965" y="370" font-family="Arial, sans-serif" font-size="24" font-weight="500" fill="#14120B" text-anchor="middle">net contribution</text><text x="90" y="540" font-family="Arial, sans-serif" font-size="23" font-weight="500" fill="#BAB7AF" text-anchor="start">ILLUSTRATIVE NUMBERS · CHECK THE COSTS FIRST</text><text x="65" y="633" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#A8AA9E" text-anchor="start">BRIAN HANSON  /  PRACTICAL AI</text><text x="1135" y="633" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#A8AA9E" text-anchor="end">ILLUSTRATION</text></svg>