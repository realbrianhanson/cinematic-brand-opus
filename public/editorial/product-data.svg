<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">MAKE THE PRODUCT UNDERSTANDABLE</title><desc id="desc">An illustrated bag is connected to labels for dimensions, materials, and variants.</desc><rect width="1200" height="675" fill="#131A15"/><text x="65" y="83" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#D4AF55" text-anchor="start">MAKE THE PRODUCT UNDERSTANDABLE</text><path d="M65 110 L1135 110" stroke="#514A36" stroke-width="1" fill="none" stroke-linecap="round"/><path d="M440 280 Q600 210 760 280 L735 475 Q600 520 465 475 Z" fill="#9EAE98"/><path d="M520 270 C500 145 690 145 680 270" fill="none" stroke="#D4AF55" stroke-width="17"/><path d="M430 400 L255 330" stroke="#D4AF55" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M755 345 L925 260" stroke="#D4AF55" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M710 470 L905 495" stroke="#D4AF55" stroke-width="3" fill="none" stroke-linecap="round"/><text x="100" y="315" font-family="Arial, sans-serif" font-size="31" font-weight="500" fill="#EEECE6" text-anchor="start">Dimensions</text><text x="905" y="235" font-family="Arial, sans-serif" font-size="31" font-weight="500" fill="#EEECE6" text-anchor="start">Materials</text><text x="910" y="520" font-family="Arial, sans-serif" font-size="31" font-weight="500" fill="#EEECE6" text-anchor="start">Variants</text><text x="80" y="570" font-family="Arial, sans-serif" font-size="23" font-weight="500" fill="#BDBAAF" text-anchor="start">VERIFY THE DETAILS. DO NOT INVENT THEM.</text><text x="65" y="633" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#A8AA9E" text-anchor="start">BRIAN HANSON  /  PRACTICAL AI</text><text x="1135" y="633" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#A8AA9E" text-anchor="end">ILLUSTRATION</text></svg>