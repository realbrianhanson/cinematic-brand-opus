<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">TALK IT THROUGH. THEN VERIFY.</title><desc id="desc">An illustrated microphone on a phone connects a single question to a reminder to check the source.</desc><rect width="1200" height="675" fill="#111725"/><text x="65" y="83" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#D4AF55" text-anchor="start">TALK IT THROUGH. THEN VERIFY.</text><path d="M65 110 L1135 110" stroke="#514A36" stroke-width="1" fill="none" stroke-linecap="round"/><rect x="420" y="150" width="260" height="380" rx="38" fill="#181E2B" stroke="#8294B8" stroke-width="3"/><rect x="440" y="177" width="220" height="325" rx="20" fill="#252F40" stroke="none" stroke-width="3"/><circle cx="550" cy="450" r="16" fill="#D4AF55" stroke="none" stroke-width="4"/><circle cx="550" cy="295" r="58" fill="#D4AF55" stroke="none" stroke-width="4"/><path d="M550 262 L550 315" stroke="#111A26" stroke-width="15" fill="none" stroke-linecap="round"/><path d="M515 295 Q515 345 550 345 Q585 345 585 295 M550 345 L550 365" fill="none" stroke="#111A26" stroke-width="8"/><rect x="90" y="215" width="275" height="150" rx="20" fill="#28372F" stroke="none" stroke-width="3"/><text x="122" y="275" font-family="Arial, sans-serif" font-size="35" font-weight="500" fill="#EEECE6" text-anchor="start">Ask one</text><text x="122" y="322" font-family="Arial, sans-serif" font-size="35" font-weight="500" fill="#EEECE6" text-anchor="start">question</text><rect x="755" y="330" width="350" height="140" rx="20" fill="#342C23" stroke="none" stroke-width="3"/><text x="790" y="390" font-family="Arial, sans-serif" font-size="31" font-weight="500" fill="#EEECE6" text-anchor="start">Check against</text><text x="790" y="432" font-family="Arial, sans-serif" font-size="31" font-weight="500" fill="#EEECE6" text-anchor="start">the source</text><path d="M370 292 L409 292" stroke="#D4AF55" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M394 280 L409 292 L394 304" fill="none" stroke="#D4AF55" stroke-width="4"/><path d="M697 395 L742 395" stroke="#D4AF55" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M727 383 L742 395 L727 407" fill="none" stroke="#D4AF55" stroke-width="4"/><text x="65" y="633" font-family="Arial, sans-serif" font-size="17" font-weight="500" fill="#A8AA9E" text-anchor="start">BRIAN HANSON  /  PRACTICAL AI</text><text x="1135" y="633" font-family="Arial, sans-serif" font-size="15" font-weight="500" fill="#A8AA9E" text-anchor="end">ILLUSTRATION</text></svg>